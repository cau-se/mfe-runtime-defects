<!doctype html>
<!--
  The one-line difference: @theme vs @theme inline.

  Build first:   npm run build
  Then open this file.

  Both boxes below are identical except for the utility class, and the two
  utilities come from token declarations that differ only by the `inline`
  keyword:

      @theme         { --color-indirect: var(--app-color-primary); }
      @theme inline  { --color-inline:   var(--app-color-primary); }

  Tailwind emits:

      .bg-indirect { background-color: var(--color-indirect); }  /* chain resolved at :root */
      .bg-inline   { background-color: var(--app-color-primary); } /* chain resolved on the element */

  Both boxes declare --app-color-primary: #e2533f on themselves. Nothing
  defines that variable at :root. So the left box resolves to the
  guaranteed-invalid value and renders transparent, while the right box
  renders red. Same input, same build, one keyword apart.

  Full four-configuration matrix: probe.html (and `npm run probes`).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tailwind @theme vs @theme inline</title>
    <link href="../dist/compare.css" rel="stylesheet" />
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        max-width: 760px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 20px;
      }
      .cell h3 {
        margin: 0 0 6px;
        font-size: 13px;
        font-family: ui-monospace, monospace;
        font-weight: normal;
      }
      .box {
        border: 1px dashed #999;
        color: #fff;
      }
      .val {
        font: 11px/1.5 ui-monospace, monospace;
        margin-top: 6px;
        white-space: pre-wrap;
      }
      pre {
        background: #111;
        color: #9fb3c8;
        padding: 10px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h2>Same element, same local token, one keyword apart</h2>

    <p>
      Expected colour for both boxes:
      <b style="color: #e2533f">#e2533f</b>. The concrete value is declared on
      both elements; no micro-frontend or stylesheet provides it at
      <code>:root</code>.
    </p>

    <div class="grid">
      <div class="cell">
        <h3>@theme — .bg-indirect</h3>
        <div
          id="box-indirect"
          class="box bg-indirect p-6"
          style="--app-color-primary: #e2533f;"
        >
          Test box
        </div>
        <div class="val" id="val-indirect"></div>
      </div>

      <div class="cell">
        <h3>@theme inline — .bg-inline</h3>
        <div
          id="box-inline"
          class="box bg-inline p-6"
          style="--app-color-primary: #e2533f;"
        >
          Test box
        </div>
        <div class="val" id="val-inline"></div>
      </div>
    </div>

    <pre id="out">running…</pre>

    <script>
      const measure = (id) => {
        const cs = getComputedStyle(document.getElementById(id));
        const color = cs.backgroundColor;
        const failed = color === 'rgba(0, 0, 0, 0)' || color === 'transparent';
        document.getElementById(`val-${id.replace('box-', '')}`).textContent =
          `${color}\n${failed ? 'INVALID at computed-value time' : 'resolved'}`;
        return {
          expected: 'rgb(226, 83, 63)',
          computedBackgroundColor: color,
          innerVariable: cs.getPropertyValue('--app-color-primary').trim(),
          outcome: failed
            ? 'INVALID at computed-value time (declaration discarded, no error)'
            : 'resolved',
        };
      };

      document.getElementById('out').textContent = JSON.stringify(
        {
          theme: measure('box-indirect'),
          themeInline: measure('box-inline'),
        },
        null,
        2,
      );
    </script>
  </body>
</html>
