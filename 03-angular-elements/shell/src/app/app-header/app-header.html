<header class="border-b border-neutral-200">
  <div class="mx-auto flex max-w-2xl items-baseline gap-8 px-6 py-3">
    <a routerLink="/home" class="text-sm font-semibold">MFE Runtime Defects</a>
    <span class="text-xs text-neutral-400">Angular {{ angularVersion }}</span>
    <nav class="flex gap-5 text-sm">
      @for (link of links; track link.route) {
        <a [routerLink]="link.route"
           routerLinkActive="text-neutral-900"
           class="text-neutral-600 hover:text-neutral-900">
          {{ link.label }} ({{ link.version }})
        </a>
      }
    </nav>
  </div>
</header>
